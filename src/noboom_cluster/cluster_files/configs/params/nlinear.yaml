search_space:
  model:
    network:
      init_args:
        individual:
          distribution: categorical
          choices: [false, true]
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1e-4
          high: 1e-3
  window_size:
    distribution: categorical
    choices: [64, 96, 128]
