model:
  compile_torch_model: False
  network:
    class_path: timesead.models.reconstruction.FEDformer
    init_args:
      input_dim: null
      model_dim: 256
      dropout: 0.1
      num_heads: 8
      fcn_dim: null
      encoder_layers: 3
      modes: 32
      fft_norm: "forward"
      w_init: "randn"
      freq_norm_mode: null
      lrfop: false
      mode_policy: "static"
      topk: 8
      shared_attention: false
      scatter_freq: false
  detector:
    class_path: timesead.models.other.EnergyAD_AnomalyDetector
    init_args:
      batch_first: True
  losses:
    class_path: torch.nn.SmoothL1Loss
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-3
trainer:
  precision: bf16-mixed
data:
  batch_dim: 0
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.FiniteDifferencesTargetTransform
      init_args:
        replace_labels: True
#    - class_path: timesead.data.transforms.MagAddNoiseTransform
#      init_args:
#        magnitude: 0.01
#        apply_prob: 1.0
#    - class_path: timesead.data.transforms.MagScaleTransform
#      init_args:
#        magnitude: 0.02
#        apply_prob: 0.5
#    - class_path: timesead.data.transforms.MaskOutTransform
#      init_args:
#        magnitude: 0.02
#        apply_prob: 0.2
#    - class_path: timesead.data.transforms.TimeWarpTransform
#      init_args:
#        magnitude: 0.02
#        apply_prob: 0.1
  val_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.FiniteDifferencesTargetTransform
      init_args:
        replace_labels: True
