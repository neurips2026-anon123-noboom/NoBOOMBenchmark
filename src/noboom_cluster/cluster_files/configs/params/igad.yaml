search_space:
  model:
    network:
      hidden_dims:
        distribution: categorical
        choices:
          - [128, 64]
          - [256, 128]
          - [128, 128, 64]
      latent_dim:
        distribution: int
        low: 16
        high: 128
        step: 16
      dropout:
        distribution: uniform
        low: 0.0
        high: 0.3
        step: 0.1
    losses:
      init_args:
        idem_weight:
          distribution: uniform
          low: 0.1
          high: 1.0
          step: 0.1
        tight_weight:
          distribution: uniform
          low: 0.1
          high: 1.0
          step: 0.1
        alpha:
          distribution: uniform
          low: 1.1
          high: 1.5
          step: 0.1
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1e-4
          high: 1e-2
  window_size:
    distribution: categorical
    choices: [16, 32, 64, 96, 128]
