study:
  direction: maximize
  load_if_exists: true
  tune_metric: alarm_score
  n_trials: 50
  sampler:
    name: TPESampler
    args:
      seed: 42
      n_startup_trials: 5
  scheduler:
    name: ASHA
    args:
      max_t: 6
      grace_period: 2
  hpo_seeds: [42]
  final_eval_after_hpo: true
  seeds: [42, 43, 44, 45, 46]
  metrics: ['alarm_score', 'aaf', 'event_recall', "edf", "ldf"]

