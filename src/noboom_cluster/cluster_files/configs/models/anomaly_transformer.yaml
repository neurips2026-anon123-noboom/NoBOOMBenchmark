model:
  predict_on_end: true
  prediction_stream:
    class_path: noboom_benchmark.noboom_lib.core.benchmark_utils.prediction_stream.WindowAtomicPredictionStream
    init_args:
      chunk_size: 8192
  compile_torch_model: false
  compile_torch_model_mode: default
  compile_torch_model_fullgraph: false
  network:
    class_path: noboom_benchmark.noboom_lib.core.models.anomaly_transformer.AnomalyTransformer
    init_args:
      win_size: null
      enc_in: null
      c_out: null
      d_model: 512
      n_heads: 8
      e_layers: 3
      d_ff: 512
      dropout: 0.0
      activation: gelu
  detector:
    class_path: noboom_benchmark.noboom_lib.core.models.anomaly_transformer.AnomalyTransformerAnomalyDetector
    init_args:
      temperature: 50.0
      batch_first: true
      batch_size: 128
  losses:
    class_path: noboom_benchmark.noboom_lib.core.models.anomaly_transformer.AnomalyTransformerLoss
    init_args:
      k: 3
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1.0e-4
trainer:
  precision: bf16-mixed
  max_epochs: 25
data:
  batch_dim: 0
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  val_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  test_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: false
