[build-system]
requires = ["uv-build>=0.7"]
build-backend = "uv_build"

[project]
name = "noboom_benchmark"
version = "0.2.0"
description = "NoBOOM Benchmark"
#readme = "README.md" ADD README.md to each subproject
license = "MIT"
requires-python = ">=3.12"

authors = [
  { name = "Anonymous Authors" },
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "jinja2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-dotenv",
  "tenacity",
  "typer",
]

[project.optional-dependencies]
benchmark = [
  "boto3",
  "filelock",
  "jsonargparse[signatures]",
  "kagglehub>=1.0.0",
  "lightning",
  "mlflow>=3.1",
  "numpy<2.4",
  "numba>=0.63",
  "omegaconf",
  "openpyxl",
  "optuna",
  "psycopg[binary,pool]",
  "pyarrow",
  "ray[default,tune]",
  "setuptools<81",
  "zstandard",
  "tqdm",
  "tqdm-joblib",
  "torch>=2.6",
  "torchvision",
  "optuna-dashboard",
  "scikit-learn",
  "webdavclient3",
  "noboom[data,baselines] @ git+https://github.com/denix56/noboom.git",
  "timesead[experiments,extensions] @ git+https://github.com/denix56/TimeSeAD.git",
]
cluster = [
  "ray[default]",
]
test = [
  "noboom @ git+https://github.com/denix56/noboom.git",
  "numpy",
  "pyarrow",
  "pytest",
  "ray[default,tune]",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/denix56/NoBoomBenchmark"
Repository = "https://github.com/denix56/NoBoomBenchmark"

[project.scripts]
noboom-run-cluster = "noboom_cluster.cli:main"
noboom-telegram-relay = "noboom_telegram_relay.relay:main"

[tool.uv.build-backend]
module-name = ["noboom_benchmark", "noboom_cluster", "noboom_telegram_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "artifacts", "tmp", "data", "figures"]

[tool.isort]
force_sort_within_sections = true
order_by_type = false
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "NOBOOM", "FIRSTPARTY", "LOCALFOLDER"]
known_noboom = ["noboom", "timesead"]
