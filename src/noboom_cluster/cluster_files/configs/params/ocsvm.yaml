search_space:
  model:
    detector:
      init_args:
        nu:
          distribution: categorical
          choices: [0.01, 0.05, 0.1, 0.2]
        gamma:
          distribution: categorical
          choices: ["scale", "auto"]
        kernel:
          distribution: categorical
          choices: ["rbf", "linear"]
  window_size:
    distribution: int
    low: 8
    high: 128
    step: 10
