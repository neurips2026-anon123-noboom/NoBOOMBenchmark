search_space:
  model:
    network:
      init_args:
        patch_size:
          distribution: categorical
          choices: [16, 32]
        patch_stride:
          distribution: categorical
          choices: [8]
        d_model:
          distribution: categorical
          choices: [64]
        e_layers:
          distribution: categorical
          choices: [2]
        dropout:
          distribution: uniform
          low: 0.0
          high: 0.3
          step: 0.1
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1e-4
          high: 1e-3
  window_size:
    distribution: categorical
    choices: [96, 192]
