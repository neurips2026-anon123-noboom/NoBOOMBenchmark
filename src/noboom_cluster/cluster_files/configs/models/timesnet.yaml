model:
  compile_torch_model: True
  compile_torch_model_mode: max-autotune-no-cudagraphs
  compile_torch_model_fullgraph: False
  network:
    class_path: timesead.models.reconstruction.TimesNet
    init_args:
      input_dim: null
      d_model: 64
      d_ff: 64
      num_kernels: 8
      e_layers: 2
      top_k: 5
      dropout: 0.1
  detector:
    class_path: timesead.models.common.MSEReconstructionAnomalyDetector
    init_args:
      batch_first: True
  losses:
    class_path: torch.nn.MSELoss
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-3
trainer:
  precision: bf16-mixed
data:
  batch_dim: 0
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: True
