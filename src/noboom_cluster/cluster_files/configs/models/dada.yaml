model:
  predict_on_end: true
  prediction_stream:
    class_path: noboom_benchmark.noboom_lib.core.benchmark_utils.prediction_stream.CausalPointRewindowPredictionStream
    init_args:
      chunk_size: 32768
  compile_torch_model: false
  detector:
    class_path: noboom_benchmark.noboom_lib.core.models.dada.DADAAnomalyDetector
    init_args:
      seq_len: null
      batch_size: 128
      copies: 10
      norm: 0
      model_path: null
      repo_path: null
      trust_remote_code: true
      auto_download: true
      cache_dir: null
      download_base_url: https://raw.githubusercontent.com/iambowen/DADA/main/DADA
trainer:
  precision: 32
data:
  batch_dim: 0
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  val_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  test_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: false
