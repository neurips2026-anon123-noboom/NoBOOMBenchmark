window_size: 100
model:
  predict_on_end: true
  prediction_stream:
    class_path: noboom_benchmark.noboom_lib.core.benchmark_utils.prediction_stream.WindowAtomicPredictionStream
    init_args:
      chunk_size: 8192
  compile_torch_model: true
  compile_torch_model_mode: max-autotune-no-cudagraphs
  compile_torch_model_fullgraph: false
  network:
    class_path: noboom_benchmark.noboom_lib.core.models.dcdetector.DCdetector
    init_args:
      win_size: null
      input_dim: null
      patch_size: [5]
      n_heads: 1
      e_layers: 3
      d_model: 256
      rec_timeseries: true
  detector:
    class_path: noboom_benchmark.noboom_lib.core.models.dcdetector.DCdetectorAnomalyDetector
    init_args:
      batch_size: 128
  losses:
    class_path: noboom_benchmark.noboom_lib.core.models.dcdetector.DCdetectorLoss
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1.0e-4
trainer:
  max_epochs: 10
  check_val_every_n_epoch: 1
  precision: bf16-mixed
data:
  batch_dim: 0
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  val_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  test_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: false
