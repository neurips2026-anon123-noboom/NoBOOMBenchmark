search_space:
  model:
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1.0e-5
          high: 1.0e-3
        weight_decay:
          distribution: loguniform
          low: 1.0e-6
          high: 1.0e-3
    network:
      init_args:
        model_dim:
          distribution: categorical
          choices: [128, 256, 512]
        ff_dim:
          distribution: categorical
          choices: [512, 1024, 2048]
        attn_dim:
          distribution: categorical
          choices: [32, 64]
        num_heads:
          distribution: categorical
          choices: [4, 8]
        num_blocks:
          distribution: int
          low: 1
          high: 3
        dropout:
          distribution: categorical
          choices: [0.0, 0.1, 0.2, 0.3]
        mafd_components:
          distribution: categorical
          choices: [8, 16, 32]
        aspe_weight:
          distribution: categorical
          choices: [0.05, 0.1, 0.2]
        energy_loss_weight:
          distribution: loguniform
          low: 1.0e-4
          high: 1.0e-2
        disturbance_factor:
          distribution: categorical
          choices: [1.0, 5.0, 10.0]
        gaussian_bandwidth_init:
          distribution: loguniform
          low: 0.05
          high: 1.0
        sampling_steps:
          distribution: categorical
          choices: [32, 64, 128]
    detector:
      init_args:
        score_alpha:
          distribution: categorical
          choices: [0.25, 0.5, 0.75]
        smoothing_kernel_size:
          distribution: categorical
          choices: [1, 3, 5, 7]
        spot_q:
          distribution: categorical
          choices: [0.005, 0.01, 0.02]
  window_size:
    distribution: categorical
    choices: [32, 64, 128]
