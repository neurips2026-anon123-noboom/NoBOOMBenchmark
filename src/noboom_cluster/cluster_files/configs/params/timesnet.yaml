search_space:
  model:
    network:
      d_model:
        distribution: int
        low: 64
        high: 128
        step: 64
      d_ff:
        distribution: int
        low: 64
        high: 128
        step: 64
      num_kernels:
        distribution: categorical
        choices: [8]
      e_layers:
        distribution: int
        low: 2
        high: 4
      top_k:
        distribution: int
        low: 3
        high: 9
        step: 2
      dropout:
        distribution: uniform
        low: 0.0
        high: 0.5
        step: 0.1
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1e-4
          high: 1e-2
  window_size:
    distribution: int
    low: 8
    high: 128
    step: 10
