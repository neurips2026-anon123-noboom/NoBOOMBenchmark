window_size: 100
model:
  predict_on_end: true
  prediction_stream:
    class_path: noboom_benchmark.noboom_lib.core.benchmark_utils.prediction_stream.WindowAtomicPredictionStream
    init_args:
      chunk_size: 8192
  compile_torch_model: true
  compile_torch_model_mode: max-autotune-no-cudagraphs
  compile_torch_model_fullgraph: false
  network:
    class_path: noboom_benchmark.noboom_lib.core.models.alora.ALoRa
    init_args:
      win_size: null
      input_dim: null
      d_model: 128
      n_heads: 1
      e_layers: 3
      dropout: 0.0
      top_k_limit: 128
      token_kernel_size: 3
      pair_indices: null
  detector:
    class_path: noboom_benchmark.noboom_lib.core.models.alora.ALoRaAnomalyDetector
    init_args:
      rank_threshold: 1.0e-2
      batch_size: 128
  losses:
    class_path: noboom_benchmark.noboom_lib.core.models.alora.ALoRaLoss
    init_args:
      lambda_reg: 10.0
      rank: 1
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1.0e-4
trainer:
  precision: bf16-mixed
  max_epochs: 3
  check_val_every_n_epoch: 1
data:
  batch_dim: 0
  batch_size: 128
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  val_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  test_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: false
