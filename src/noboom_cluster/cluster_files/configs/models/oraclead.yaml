model:
  predict_on_end: true
  prediction_stream:
    class_path: noboom_benchmark.noboom_lib.core.benchmark_utils.prediction_stream.WindowAtomicPredictionStream
    init_args:
      chunk_size: 8192
  compile_torch_model: true
  compile_torch_model_mode: max-autotune-no-cudagraphs
  compile_torch_model_fullgraph: false
  network:
    class_path: noboom_benchmark.noboom_lib.core.models.oraclead.OracleAD
    init_args:
      input_dim: null
      win_size: null
      hidden_dim: 64
      num_layers: 2
      num_heads: 4
      dropout: 0.1
  detector:
    class_path: noboom_benchmark.noboom_lib.core.models.oraclead.OracleADAnomalyDetector
    init_args:
      batch_size: 1024
      deviation_weight: 1.0
      score_fusion: multiply
  losses:
    class_path: noboom_benchmark.noboom_lib.core.models.oraclead.OracleADLoss
    init_args:
      reconstruction_weight: 0.1
      structure_weight: 3.0
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 5.0e-4
      weight_decay: 1.0e-5
seed_everything: 2026
trainer:
  max_epochs: 25
  precision: bf16-mixed
data:
  batch_dim: 0
  batch_size: 1024
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  val_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  test_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: false
