search_space:
  model:
    network:
      init_args:
        dims:
          distribution: categorical
          choices:
            - [64, 64]
            - [128, 128]
        num_blocks:
          distribution: categorical
          choices:
            - [1, 1]
            - [2, 1]
        large_size:
          distribution: categorical
          choices:
            - [15, 15]
            - [31, 15]
        dropout:
          distribution: uniform
          low: 0.0
          high: 0.2
          step: 0.1
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1e-4
          high: 1e-3
  window_size:
    distribution: categorical
    choices: [64, 96, 128]
