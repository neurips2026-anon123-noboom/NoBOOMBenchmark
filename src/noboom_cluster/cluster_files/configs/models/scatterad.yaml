seed_everything: 2026
model:
  predict_on_end: true
  prediction_stream:
    class_path: noboom_benchmark.noboom_lib.core.benchmark_utils.prediction_stream.WindowAtomicPredictionStream
    init_args:
      chunk_size: 8192
  compile_torch_model: true
  compile_torch_model_mode: max-autotune-no-cudagraphs
  compile_torch_model_fullgraph: false
  network:
    class_path: noboom_benchmark.noboom_lib.core.models.scatterad.ScatterAD
    init_args:
      input_dim: null
      win_size: null
      hidden_dim: 128
      num_layers: 2
      heads: 4
      tau: 2
      dropout: 0.1
      kernel_size: 3
      ema_momentum: 0.5
      scoring_mode: distance
  detector:
    class_path: noboom_benchmark.noboom_lib.core.models.scatterad.ScatterADAnomalyDetector
    init_args:
      batch_size: 128
  losses:
    class_path: noboom_benchmark.noboom_lib.core.models.scatterad.ScatterADLoss
    init_args:
      scatter_weight: 1.0
      time_weight: 1.0
      contrast_weight: 1.0
  optimizer:
    class_path: noboom_benchmark.noboom_lib.core.models.scatterad.ScatterADAdam
    init_args:
      lr: 1.0e-4
trainer:
  precision: bf16-mixed
  max_epochs: 10
  check_val_every_n_epoch: 1
data:
  batch_dim: 0
  batch_size: 128
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  val_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
  test_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: false
