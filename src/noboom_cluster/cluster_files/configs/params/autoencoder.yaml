search_space:
  model:
    network:
      init_args:
        hidden_dims:
          distribution: categorical
          choices:
            - [128, 64]
            - [256, 128]
        latent_dim:
          distribution: categorical
          choices: [16, 32, 64]
        dropout:
          distribution: uniform
          low: 0.0
          high: 0.2
          step: 0.1
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1e-4
          high: 1e-3
  window_size:
    distribution: categorical
    choices: [64, 96, 128]
