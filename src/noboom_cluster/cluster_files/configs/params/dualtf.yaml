search_space:
  model:
    network:
      init_args:
        d_model:
          distribution: categorical
          choices: [64, 128]
        e_layers:
          distribution: int
          low: 1
          high: 2
          step: 1
        n_heads:
          distribution: categorical
          choices: [2, 4]
        d_ff:
          distribution: categorical
          choices: [128, 256]
        dropout:
          distribution: uniform
          low: 0.0
          high: 0.2
          step: 0.1
    optimizer:
      init_args:
        lr:
          distribution: loguniform
          low: 1e-4
          high: 1e-3
  window_size:
    distribution: categorical
    choices: [64, 96, 128]
