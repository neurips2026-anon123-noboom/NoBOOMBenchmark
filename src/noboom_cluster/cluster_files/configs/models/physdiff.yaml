window_size: 64
model:
  compile_torch_model: false
  network:
    class_path: noboom_benchmark.noboom_lib.core.physdiff.PhysDiff
    init_args:
      win_size: null
      num_channels: null
      time_steps: 1000
      beta_start: 1.0e-4
      beta_end: 0.02
      model_dim: 512
      ff_dim: 2048
      attn_dim: 64
      num_heads: 8
      num_blocks: 2
      dropout: 0.2
      mafd_components: 16
      dictionary_distance: 0.05
      aspe_tolerance: 1.0e-3
      max_magnitude: 0.95
      mafd_loss_weight: 1.0
      aspe_weight: 0.1
      energy_loss_weight: 1.0e-3
      disturbance_factor: 10.0
      langevin_step: 1.0e-3
      langevin_noise: true
      gaussian_bandwidth_init: 0.25
      sampling_steps: 64
      legacy_disturbance: true
  detector:
    class_path: noboom_benchmark.noboom_lib.core.physdiff.PhysDiffAnomalyDetector
    init_args:
      score_alpha: 0.5
      smoothing_kernel_size: 5
      spot_q: 0.01
      reconstruction_num_samples: 1
      component_standardize: false
      score_normalize: false
  losses:
    class_path: noboom_benchmark.noboom_lib.core.physdiff.PhysDiffLoss
    init_args:
      mafd_loss_weight: 1.0
      aspe_weight: 0.1
      energy_loss_weight: 1.0e-3
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1.0e-4
      weight_decay: 1.0e-4
trainer:
  max_epochs: 25
  precision: 32
data:
  batch_dim: 0
  train_transform:
    - class_path: timesead.data.transforms.WindowTransformIfNotWindow
      init_args:
        window_size: null
    - class_path: timesead.data.transforms.ReconstructionTargetTransform
      init_args:
        replace_labels: true
